# engines.toml — pinned source-of-truth for engines the Executor depends on.
#
# This file is the Intraface repo's authority on "what engines, at what
# commits, for what role." The engine *binaries* are NOT in this repo — they
# live in the standalone engine checkouts at ~/prj/{llama,ik_llama}.cpp/ and
# are built from source there. This manifest records which commits are
# known-good so a future agent can reproduce or verify.
#
# To re-pin after an upstream pull:
#   cd ~/prj/<engine> && git rev-parse HEAD
#   paste the full hash below
#   update `pin_date`

# ----- Substrate for the Core (resident model: GLM-4.7-Flash) -----

[engines.ik_llama_cpp]
role              = "core"                                            # serves the Core
upstream          = "https://github.com/ikawrakow/ik_llama.cpp.git"
mirror            = "ssh://git@git.ism.la:6666/rtr/ik_llama.cpp.git"
checkout_path     = "/home/prtr/prj/ik_llama.cpp"
pinned_commit     = "86d8e9a13c4d6e6fead9c9489ade4b0d283afc53"        # main, 2026-07-06
pin_date          = "2026-07-06"
binary            = "llama-server"
binary_relpath    = "build/bin/llama-server"
purpose           = "Serves the Core model (GLM-4.7-Flash) over HTTP on 127.0.0.1:7712."
build_notes       = "CUDA build. Run `llama-bench` after rebuild to confirm."

# ----- Substrate for Units (spawned per-call: extract, future units) -----

[engines.llama_cpp]
role              = "unit"                                            # serves Units
upstream          = "https://github.com/ggml-org/llama.cpp.git"
mirror            = "ssh://git@git.ism.la:6666/rtr/llama.cpp.git"
checkout_path     = "/home/prtr/prj/llama.cpp"
pinned_commit     = "a2d90e887ac0f79accaa095f30a71a907f7f3536"        # main, 2026-07-06
pin_date          = "2026-07-06"
binary            = "llama-cli"
binary_relpath    = "build/bin/llama-cli"
purpose           = "Per-call SLM inference for Units (extract, future). Spawned via argv-array, never sh -c."
build_notes       = "CPU-only is sufficient for Units — see `extract.ts` CUDA_VISIBLE_DEVICES=\"\" discipline."

# ----- Known defects at pinned commits (do not re-litigate without re-testing) -----

[defects]
# `-j` / `--json-schema` throws on sampler init at llama.cpp 9861.
# Reproduced 2026-07-06. `--grammar-file *.gbnf` is the runtime constraint
# mechanism until upstream fixes it.
[defects.json_schema]
engine            = "llama_cpp"
last_verified     = "2026-07-06"
symptom           = "Failed to initialize samplers: std::exception"
workaround        = "Use --grammar-file with a hand-maintained .gbnf (see units/extract/grammar.gbnf)"

# Resolved 2026-07-29 (verification below). Retained for provenance — if the
# defect returns after a future rebuild, this is the shape it will take.
[defects.ik_llama_json_schema]
engine            = "ik_llama_cpp"
status            = "resolved"
last_verified     = "2026-07-29"
symptom           = "500: Unable to generate parser for this template. Automatic parser generation failed: JSON schema conversion failed: Unrecognized schema: true"
trigger           = "Tool schemas that include `additionalProperties: true` (JSON Schema 2020-12 boolean form). Pipecat's auto-derived schemas historically included this; the OpenAI SDK still does."
verification      = "Probed live llama-server at 127.0.0.1:7712 with three tool schemas — one with `additionalProperties: true`, one minimal (no booleans), one with typed enum arg. All three returned HTTP 200. Full tool-call roundtrip verified: model emitted `tool_calls` with correct enum args."
mechanism_unknown = "Pinned commit (86d8e9a1) and live binary match the documented-defective commit. Binary rebuilt 2026-07-29 10:02 against the same commit. Defect is empirically gone but the upstream patch path is unverified. If the defect returns, the most likely cause is a rebuild against a different commit — re-pin or re-test."
workaround        = "No longer needed. Pipecat's FunctionSchema.to_default_dict() does not emit the trigger regardless, so the standard tool-registration path is safe even on an unfixed server."
